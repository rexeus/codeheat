name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions: {}

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  select-mode:
    name: Select release mode
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Select version, publish, or no-op
        id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: Create or update version PR
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      pull-requests: write
    steps:
      # changesets/action needs the checkout token to update the release branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  publish:
    name: Publish to npm
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      id-token: write
    steps:
      # changesets/action pushes the release tag with git; the token must persist.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Node 24 bundles npm 11.6+, which supports trusted publishing (OIDC).
      - run: npm --version
      - run: pnpm install --frozen-lockfile
      # pnpm check builds, packs, and installs the package before anything is published.
      - run: pnpm check
      - name: Publish packages and create releases
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        env:
          # Provenance is set here, not in publishConfig, so a local publish needs no flags.
          NPM_CONFIG_PROVENANCE: "true"
        with:
          script: pnpm release
